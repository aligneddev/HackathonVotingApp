name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to deploy manually'
        type: choice
        required: true
        default: prod
        options:
          - dev
          - prod
      confirm_production:
        description: 'Set to true to confirm production deployment'
        type: boolean
        required: true
        default: false

env:
  AZURE_RESOURCE_GROUP: kl-hackathon-rg
  AZURE_APP_NAME: kl-hackathon-voting

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────────
  build-and-test-api:
    name: .NET API — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test API Endpoints (E2E)
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~HackathonVotingApp.Api.Tests.Endpoints"

      - name: Test API (Non-Endpoint)
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName!~HackathonVotingApp.Api.Tests.Endpoints"

      - name: Publish API
        if: github.event_name != 'pull_request'
        run: dotnet publish src/HackathonVotingApp.Api/HackathonVotingApp.Api.csproj --configuration Release --output ./publish/api

      - name: Zip API for deployment
        if: github.event_name != 'pull_request'
        run: cd ./publish/api && zip -r ../../api.zip .

      - name: Upload API artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./api.zip

  build-and-test-frontend:
    name: React Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Deploy Dev (main branch auto-deploy) ───────────────────────────────────
  deploy-infra-dev:
    name: Deploy Dev — Azure Infrastructure (Bicep)
    needs: [build-and-test-api, build-and-test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      staticWebAppName: ${{ steps.deploy.outputs.staticWebAppName }}
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
      frontendUrl: ${{ steps.deploy.outputs.frontendUrl }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            environmentName=dev
            appName=${{ env.AZURE_APP_NAME }}
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}

  deploy-api-dev:
    name: Deploy Dev — .NET API → App Service
    needs: deploy-infra-dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra-dev.outputs.webAppName }}
          package: ./api.zip

      - name: Configure Admin Password
        run: |
          az webapp config appsettings set \
            --name ${{ needs.deploy-infra-dev.outputs.webAppName }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings AdminPassword=${{ secrets.ADMIN_PASSWORD }}

      - name: Smoke Test API
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            "${{ needs.deploy-infra-dev.outputs.apiUrl }}/api/health"

  deploy-frontend-dev:
    name: Deploy Dev — React Frontend → Static Web App
    needs: [deploy-infra-dev, build-and-test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-infra-dev.outputs.apiUrl }}

      - name: Smoke Test Frontend
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            "${{ needs.deploy-infra-dev.outputs.frontendUrl }}"

  # ── Deploy Prod (manual dispatch + approval) ───────────────────────────────
  deploy-infra-prod:
    name: Deploy Prod — Azure Infrastructure (Bicep)
    needs: [build-and-test-api, build-and-test-frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && github.event.inputs.confirm_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      webAppName: ${{ steps.deploy.outputs.webAppName }}
      staticWebAppName: ${{ steps.deploy.outputs.staticWebAppName }}
      apiUrl: ${{ steps.deploy.outputs.apiUrl }}
      frontendUrl: ${{ steps.deploy.outputs.frontendUrl }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep Infrastructure
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >
            environmentName=prod
            appName=${{ env.AZURE_APP_NAME }}
            sqlAdminPassword=${{ secrets[format('{0}', 'SQL_ADMIN_PASSWORD_PROD')] }}

  deploy-api-prod:
    name: Deploy Prod — .NET API → App Service
    needs: deploy-infra-prod
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && github.event.inputs.confirm_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra-prod.outputs.webAppName }}
          package: ./api.zip

      - name: Configure Admin Password
        run: |
          az webapp config appsettings set \
            --name ${{ needs.deploy-infra-prod.outputs.webAppName }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings AdminPassword=${{ secrets.ADMIN_PASSWORD_PROD }}

      - name: Smoke Test API
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            "${{ needs.deploy-infra-prod.outputs.apiUrl }}/api/health"

  deploy-frontend-prod:
    name: Deploy Prod — React Frontend → Static Web App
    needs: [deploy-infra-prod, build-and-test-frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod' && github.event.inputs.confirm_production == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('{0}', 'AZURE_STATIC_WEB_APPS_API_TOKEN_PROD')] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/frontend
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-infra-prod.outputs.apiUrl }}

      - name: Smoke Test Frontend
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused \
            "${{ needs.deploy-infra-prod.outputs.frontendUrl }}"

